<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" font-family="Arial, Helvetica, sans-serif"><rect width="1800" height="1240" fill="#FFFFFF"/><defs><marker id="a0F4761" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F4761"/></marker><marker id="a0F4761s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F4761"/></marker><marker id="a842E36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#842E36"/></marker><marker id="a842E36s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#842E36"/></marker><marker id="a9AA9B5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA9B5"/></marker><marker id="a9AA9B5s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA9B5"/></marker></defs><text x="40" y="52" font-size="15" fill="#842E36" font-weight="bold" text-anchor="start">FASTTRACKS CAR CARE</text><text x="40" y="88" font-size="32" fill="#0F4761" font-weight="bold" text-anchor="start">Mobile App — Architecture &amp; Data Flow</text><text x="40" y="116" font-size="15" fill="#5A5A6A" font-weight="normal" text-anchor="start">Current state as built (October 2026). The app has no backend of its own: it uses the same backend and database as the web dashboard.</text><line x1="40" y1="134" x2="1760" y2="134" stroke="#842E36" stroke-width="3"/><rect x="40" y="160" width="640" height="760" rx="18" fill="#F6EEEF" stroke="#842E36" stroke-width="2"/><text x="60" y="194" font-size="17" fill="#842E36" font-weight="bold" text-anchor="start">EMPLOYEE PHONE  ·  Android / iOS</text><text x="60" y="216" font-size="14" fill="#5A5A6A" font-weight="normal" text-anchor="start">FastTracks Mobile App — Expo SDK 57 · React Native 0.86 · React 19 · TypeScript</text><rect x="60" y="234" width="600" height="140" rx="10" fill="#fff" stroke="#D9CDCF" stroke-width="1.5"/><text x="74" y="258" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="start">1. Screens (UI)  ·  ~45 screens</text><text x="74" y="280" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Login  →  Home tab (clock-in, timesheet, reminders, tasks widgets)</text><text x="74" y="300" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Conversations tab (WhatsApp threads)</text><text x="74" y="320" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Side menu → 39 modules: Customers &amp; Jobs, Tasks, Timesheets,</text><text x="74" y="340" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Attendance, HR, Payroll, Finance, Purchase, Inventory, Sales…</text><rect x="60" y="388" width="600" height="96" rx="10" fill="#fff" stroke="#D9CDCF" stroke-width="1.5"/><text x="74" y="412" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="start">2. Navigation  ·  Expo Router</text><text x="74" y="434" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Root Stack  →  login guard (logged-in vs logged-out screens)</text><text x="74" y="454" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">2 bottom tabs (NativeTabs)  +  side menu built from screen-registry.ts</text><rect x="60" y="498" width="600" height="118" rx="10" fill="#fff" stroke="#D9CDCF" stroke-width="1.5"/><text x="74" y="522" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="start">3. App state  ·  React Context providers</text><text x="74" y="544" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">AuthProvider — current user, sign-in / sign-out</text><text x="74" y="564" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">PermissionsProvider — role &amp; per-employee tab access (fails closed)</text><text x="74" y="584" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">DrawerProvider — side menu open / close</text><rect x="60" y="630" width="600" height="140" rx="10" fill="#fff" stroke="#D9CDCF" stroke-width="1.5"/><text x="74" y="654" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="start">4. Services  ·  src/lib</text><text x="74" y="676" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">api.ts — axios client, ~400 API functions, adds JWT to every call,</text><text x="74" y="696" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">              logs out automatically on 401</text><text x="74" y="716" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">upload.ts — camera/gallery pick + upload with progress</text><text x="74" y="736" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">push-notifications.ts — register device, open screen on tap</text><rect x="60" y="784" width="600" height="116" rx="10" fill="#FFFFFF" stroke="#D9CDCF" stroke-width="1.5"/><text x="74" y="808" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="start">5. Phone features  ·  Expo modules</text><text x="74" y="830" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Secure Store (JWT in Keychain/Keystore)  ·  Camera &amp; Gallery</text><text x="74" y="850" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Notifications  ·  File system &amp; Share  ·  Excel export (xlsx)</text><text x="74" y="870" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Date picker  ·  Clipboard  ·  Reanimated animations</text><line x1="360.0" y1="374" x2="360.0" y2="388" stroke="#842E36" stroke-width="2" marker-end="url(#a842E36)"/><line x1="360.0" y1="484" x2="360.0" y2="498" stroke="#842E36" stroke-width="2" marker-end="url(#a842E36)"/><line x1="360.0" y1="616" x2="360.0" y2="630" stroke="#842E36" stroke-width="2" marker-end="url(#a842E36)"/><line x1="360.0" y1="770" x2="360.0" y2="784" stroke="#842E36" stroke-width="2" marker-end="url(#a842E36)"/><rect x="800" y="160" width="520" height="600" rx="18" fill="#E7EEF3" stroke="#0F4761" stroke-width="2"/><text x="820" y="194" font-size="17" fill="#0F4761" font-weight="bold" text-anchor="start">BACKEND SERVER  ·  Azure VM (PM2)</text><text x="820" y="216" font-size="14" fill="#5A5A6A" font-weight="normal" text-anchor="start">dashboard.fasttrackscarcare.in/api/v1</text><rect x="820" y="234" width="480" height="96" rx="10" fill="#fff" stroke="#D9CDCF" stroke-width="1.5"/><text x="834" y="258" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="start">Node.js + Express API</text><text x="834" y="280" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Same API used by the web dashboard</text><text x="834" y="300" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">~650 routes · mobile uses 340 of them</text><rect x="820" y="344" width="480" height="118" rx="10" fill="#fff" stroke="#D9CDCF" stroke-width="1.5"/><text x="834" y="368" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="start">Security layer</text><text x="834" y="390" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">verifyToken — checks the JWT on every request</text><text x="834" y="410" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Role checks + per-employee permissions</text><text x="834" y="430" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">(the server always makes the final decision)</text><rect x="820" y="476" width="480" height="140" rx="10" fill="#fff" stroke="#D9CDCF" stroke-width="1.5"/><text x="834" y="500" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="start">Route modules</text><text x="834" y="522" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">auth · attendance · tasks · timesheets · leave</text><text x="834" y="542" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">customers · job cards · invoices · quotations</text><text x="834" y="562" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">payroll · payslips · expenses · inventory · ERP</text><text x="834" y="582" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">team chat · conversations · calls · devices …</text><rect x="820" y="630" width="480" height="110" rx="10" fill="#fff" stroke="#D9CDCF" stroke-width="1.5"/><text x="834" y="654" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="start">Prisma ORM + services</text><text x="834" y="676" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Database access · file uploads · push sender (FCM)</text><text x="834" y="696" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">PDF/Excel generation · WhatsApp / Exotel / n8n hooks</text><line x1="1060.0" y1="330" x2="1060.0" y2="344" stroke="#0F4761" stroke-width="2" marker-end="url(#a0F4761)"/><line x1="1060.0" y1="462" x2="1060.0" y2="476" stroke="#0F4761" stroke-width="2" marker-end="url(#a0F4761)"/><line x1="1060.0" y1="616" x2="1060.0" y2="630" stroke="#0F4761" stroke-width="2" marker-end="url(#a0F4761)"/><rect x="800" y="790" width="520" height="100" rx="14" fill="#FFFFFF" stroke="#9AA9B5" stroke-width="1.5" stroke-dasharray="6 5"/><text x="820" y="818" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="start">Web Dashboard (Next.js)</text><text x="820" y="842" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Uses the same API and data — so anything changed</text><text x="820" y="862" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">on the phone shows on the web, and the other way round.</text><line x1="1060.0" y1="790" x2="1060.0" y2="764" stroke="#9AA9B5" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a9AA9B5)"/><text x="1420" y="182" font-size="17" fill="#0F4761" font-weight="bold" text-anchor="start">DATA &amp; EXTERNAL SERVICES</text><rect x="1420" y="200" width="340" height="100" rx="14" fill="#FFFFFF" stroke="#0F4761" stroke-width="2"/><text x="1436" y="226" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="start">PostgreSQL (Supabase)</text><text x="1436" y="248" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Main database — employees, jobs,</text><text x="1436" y="268" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">attendance, finance, inventory…</text><rect x="1420" y="320" width="340" height="100" rx="14" fill="#FFFFFF" stroke="#0F4761" stroke-width="2"/><text x="1436" y="346" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="start">Azure Blob Storage</text><text x="1436" y="368" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Photos, documents, bills,</text><text x="1436" y="388" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">inspection media</text><rect x="1420" y="440" width="340" height="100" rx="14" fill="#FFFFFF" stroke="#842E36" stroke-width="2"/><text x="1436" y="466" font-size="15" fill="#842E36" font-weight="bold" text-anchor="start">Firebase Cloud Messaging</text><text x="1436" y="488" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Sends push notifications</text><text x="1436" y="508" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">to Android phones</text><rect x="1420" y="560" width="340" height="120" rx="14" fill="#FFFFFF" stroke="#0F4761" stroke-width="2"/><text x="1436" y="586" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="start">Other integrations</text><text x="1436" y="608" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">WhatsApp (conversations)</text><text x="1436" y="628" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Exotel (calls &amp; recordings)</text><text x="1436" y="648" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">n8n · AI services</text><line x1="1320" y1="250" x2="1416" y2="250" stroke="#0F4761" stroke-width="2" marker-end="url(#a0F4761)"/><line x1="1320" y1="370" x2="1416" y2="370" stroke="#0F4761" stroke-width="2" marker-end="url(#a0F4761)"/><line x1="1320" y1="490" x2="1416" y2="490" stroke="#0F4761" stroke-width="2" marker-end="url(#a0F4761)"/><line x1="1320" y1="620" x2="1416" y2="620" stroke="#0F4761" stroke-width="2" marker-end="url(#a0F4761)"/><line x1="684" y1="590" x2="794" y2="590" stroke="#0F4761" stroke-width="3.5" marker-end="url(#a0F4761)" marker-start="url(#a0F4761s)"/><text x="740.0" y="556" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="middle">HTTPS</text><text x="740.0" y="576" font-size="13" fill="#5A5A6A" font-weight="normal" text-anchor="middle">REST + JWT</text><path d="M 1760 490 L 1782 490 L 1782 950 L 360.0 950 L 360.0 926" fill="none" stroke="#842E36" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a842E36)"/><text x="975.0" y="940" font-size="14" fill="#842E36" font-weight="bold" text-anchor="middle">Push notification → tap opens Tasks / Reminders / Conversation</text><rect x="40" y="990" width="1100" height="200" rx="14" fill="#FFFFFF" stroke="#D9CDCF" stroke-width="1.5"/><text x="60" y="1022" font-size="16" fill="#0F4761" font-weight="bold" text-anchor="start">How one action flows (example: submitting a timesheet)</text><rect x="60" y="1042" width="172" height="92" rx="10" fill="#F6EEEF" stroke="#D9CDCF" stroke-width="1"/><circle cx="82" cy="1066" r="13" fill="#842E36"/><text x="82" y="1071" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="72" y="1102" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">User taps Submit on</text><text x="72" y="1122" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">the screen</text><rect x="240" y="1042" width="172" height="92" rx="10" fill="#E7EEF3" stroke="#D9CDCF" stroke-width="1"/><circle cx="262" cy="1066" r="13" fill="#0F4761"/><text x="262" y="1071" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="252" y="1102" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Screen calls a</text><text x="252" y="1122" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">function in api.ts</text><rect x="420" y="1042" width="172" height="92" rx="10" fill="#F6EEEF" stroke="#D9CDCF" stroke-width="1"/><circle cx="442" cy="1066" r="13" fill="#842E36"/><text x="442" y="1071" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="432" y="1102" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">axios adds the saved</text><text x="432" y="1122" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">JWT token</text><rect x="600" y="1042" width="172" height="92" rx="10" fill="#E7EEF3" stroke="#D9CDCF" stroke-width="1"/><circle cx="622" cy="1066" r="13" fill="#0F4761"/><text x="622" y="1071" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="612" y="1102" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Express checks token</text><text x="612" y="1122" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">&amp; permission</text><rect x="780" y="1042" width="172" height="92" rx="10" fill="#F6EEEF" stroke="#D9CDCF" stroke-width="1"/><circle cx="802" cy="1066" r="13" fill="#842E36"/><text x="802" y="1071" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="792" y="1102" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Prisma saves to</text><text x="792" y="1122" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">PostgreSQL</text><rect x="960" y="1042" width="172" height="92" rx="10" fill="#E7EEF3" stroke="#D9CDCF" stroke-width="1"/><circle cx="982" cy="1066" r="13" fill="#0F4761"/><text x="982" y="1071" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">6</text><text x="972" y="1102" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">JSON reply → screen</text><text x="972" y="1122" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">updates</text><text x="60" y="1166" font-size="14" fill="#5A5A6A" font-weight="normal" text-anchor="start" font-style="italic">If the token is expired or invalid (401), the app clears it and returns to the Login screen.</text><rect x="1170" y="990" width="590" height="200" rx="14" fill="#FFFFFF" stroke="#D9CDCF" stroke-width="1.5"/><text x="1190" y="1022" font-size="16" fill="#0F4761" font-weight="bold" text-anchor="start">Build &amp; release</text><rect x="1190" y="1042" width="160" height="64" rx="10" fill="#E7EEF3" stroke="#0F4761" stroke-width="1.5"/><text x="1270" y="1070" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="middle">GitHub</text><text x="1270" y="1090" font-size="13" fill="#5A5A6A" font-weight="normal" text-anchor="middle">source code</text><line x1="1352" y1="1074" x2="1376" y2="1074" stroke="#0F4761" stroke-width="2" marker-end="url(#a0F4761)"/><rect x="1380" y="1042" width="160" height="64" rx="10" fill="#E7EEF3" stroke="#0F4761" stroke-width="1.5"/><text x="1460" y="1070" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="middle">EAS Build</text><text x="1460" y="1090" font-size="13" fill="#5A5A6A" font-weight="normal" text-anchor="middle">Expo cloud</text><line x1="1542" y1="1074" x2="1566" y2="1074" stroke="#0F4761" stroke-width="2" marker-end="url(#a0F4761)"/><rect x="1570" y="1042" width="160" height="64" rx="10" fill="#E7EEF3" stroke="#0F4761" stroke-width="1.5"/><text x="1650" y="1070" font-size="15" fill="#0F4761" font-weight="bold" text-anchor="middle">Android APK</text><text x="1650" y="1090" font-size="13" fill="#5A5A6A" font-weight="normal" text-anchor="middle">internal testing</text><text x="1190" y="1138" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">iOS: waiting on Apple Developer enrolment.</text><text x="1190" y="1160" font-size="14" fill="#1F1F24" font-weight="normal" text-anchor="start">Not yet on Play Store / App Store.</text></svg>